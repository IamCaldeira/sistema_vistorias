  </div>
</div>

<script src="/web/comum.js"></script>
<script>
/* =====================================================================
   Aplicativo do celular - "local primeiro": tudo o que você faz é salvo no
   próprio celular (IndexedDB) e enviado ao notebook em segundo plano.
   Sem conexão, a vistoria continua normalmente e é enviada quando voltar.
   ===================================================================== */
const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const IDB = (() => {
  let dbp;
  const abrir = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('frota', 1);
    r.onupgradeneeded = () => {
      const d = r.result;
      d.createObjectStore('kv'); d.createObjectStore('veiculos', {keyPath: 'id'});
      d.createObjectStore('fila', {keyPath: 'seq', autoIncrement: true});
      d.createObjectStore('blobs'); d.createObjectStore('erros', {keyPath: 'seq', autoIncrement: true});
    };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  async function tx(nomes, modo, fn) {   // dentro de fn, só aguarde requisições do IndexedDB
    const d = await abrir(), t = d.transaction(nomes, modo), L = {};
    nomes.forEach(n => L[n] = t.objectStore(n));
    const fim = new Promise((res, rej) => { t.oncomplete = res; t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
    fim.catch(() => {});
    let out; try { out = await fn(L); } catch (e) { try { t.abort(); } catch (_) {} throw e; }
    await fim; return out;
  }
  return {tx,
    get: (s, k) => tx([s], 'readonly', L => req(L[s].get(k))),
    put: (s, v, k) => tx([s], 'readwrite', L => req(k === undefined ? L[s].put(v) : L[s].put(v, k))),
    del: (s, k) => tx([s], 'readwrite', L => req(L[s].delete(k))),
    todos: s => tx([s], 'readonly', L => req(L[s].getAll())),
    limpar: s => tx([s], 'readwrite', L => req(L[s].clear()))};
})();

/* ---------------- estado ---------------- */
let usuario = null, cfg = null, pos = null, gpsErro = '', v = null, filtro = 'pendente', busca = '';
let online = true, sessaoExpirada = false, sincP = null, ultimaSync = 0, idmapMem = {};
const app = $('#app'), blobUrls = new Map();
const pad = n => String(n).padStart(2, '0');
const agoraStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const normJs = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
const limparChave = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 20);
function calcChave(placa, pat) {
  let p = limparChave(placa); if (['', 'SEMPLACA', 'SP', 'NA', 'NAO', 'NT', 'SPLACA'].includes(p)) p = '';
  if (p) return p; const t = limparChave(pat); return t ? 'PAT' + t : '';
}
const tratar = e => { if (e.sessao) { sessaoExpirada = true; atualizaEstado(); alert('Sessão expirada. Feche e abra o aplicativo para entrar de novo (seus dados no celular são mantidos).'); } else alert(e.message); };
const semRede = e => { if (e instanceof TypeError) online = false; if (e && e.sessao) sessaoExpirada = true; };

/* ---------------- GPS ---------------- */
function iniciarGPS() {
  if (!window.isSecureContext) { gpsErro = 'GPS: abra pelo https'; return; }
  if (!navigator.geolocation) { gpsErro = 'Sem suporte a GPS'; return; }
  navigator.geolocation.watchPosition(
    p => { pos = {lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now()}; gpsErro = ''; },
    err => { gpsErro = err.code === 1 ? 'GPS: permissão negada' : 'GPS sem sinal'; },
    {enableHighAccuracy: true, maximumAge: 5000, timeout: 30000});
}
function atualizaGPS() {
  const el = $('#gps');
  if (pos && Date.now() - pos.t < 120000) {
    el.textContent = `GPS ±${Math.round(pos.acc)} m`; el.className = 'gps ' + (pos.acc <= 20 ? 'ok' : pos.acc <= 50 ? 'med' : 'ruim');
  } else { el.textContent = gpsErro || 'GPS buscando...'; el.className = 'gps'; }
}
const gpsParams = () => (pos && Date.now() - pos.t < 120000) ? {lat: pos.lat, lon: pos.lon, acc: pos.acc} : {};
async function atualizaEstado() {
  const fila = await IDB.todos('fila').catch(() => []);
  const el = $('#estado'); let t = online ? 'Conectado ao notebook' : 'Sem conexão · trabalhando offline';
  if (fila.length) t += ` · ${fila.length} envio(s) pendente(s)`;
  if (sessaoExpirada) t = 'Sessão expirada · reabra o aplicativo';
  el.textContent = t; el.className = 'estado' + (online && !sessaoExpirada ? '' : ' off');
}
setInterval(() => { atualizaGPS(); atualizaEstado(); }, 2000);
$('#gps').onclick = () => { if (navigator.geolocation && window.isSecureContext) navigator.geolocation.getCurrentPosition(
  p => { pos = {lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now()}; atualizaGPS(); },
  () => { gpsErro = 'GPS sem sinal'; atualizaGPS(); }, {enableHighAccuracy: true, timeout: 20000}); };

/* ---------------- início ---------------- */
iniciarSessao(async (eu, info) => {
  usuario = eu;
  $('#quem').textContent = `${eu.nome} · Mat. ${eu.matricula}`;
  idmapMem = (await IDB.get('kv', 'idmap')) || {};
  ultimaSync = (await IDB.get('kv', 'ultima')) || 0;
  try { cfg = await api('/api/config'); localStorage.setItem('cfg', JSON.stringify(cfg)); online = true; }
  catch (e) {
    semRede(e); try { cfg = JSON.parse(localStorage.getItem('cfg')); } catch (_) {}
    if (!cfg) { app.innerHTML = '<div class="aviso verm">Abra o aplicativo uma vez, conectado ao notebook, para baixar a lista de veículos.</div>'; return; }
  }
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
  if ('serviceWorker' in navigator && window.isSecureContext) navigator.serviceWorker.register('/sw.js').catch(() => {});
  iniciarGPS(); atualizaGPS(); atualizaEstado();
  await sincronizar(true);
  telaLista();
  setInterval(ciclo, 10000);
  window.addEventListener('online', ciclo);
});
$('#sair').onclick = async () => {
  const n = (await IDB.todos('fila')).length;
  if (!confirm(n ? `Há ${n} envio(s) pendente(s). Eles continuam salvos no celular e serão enviados quando você entrar de novo. Sair?` : 'Sair?')) return;
  sairDoSistema();
};

/* ---------------- conexão e sincronização ---------------- */
async function ping() {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 4000);
  try { const r = await fetch('/api/eu', {cache: 'no-store', signal: ctl.signal}); online = true; sessaoExpirada = r.status === 401; }
  catch (e) { online = false; } finally { clearTimeout(t); }
  return online;
}
async function ciclo() {
  await ping();
  if (online && !sessaoExpirada) {
    const n = (await IDB.todos('fila')).length;
    if (n > 0 || Date.now() - ultimaSync > 120000) await sincronizar(true);
  }
  atualizaEstado();
}
function sincronizar(forcarDownload = false) {
  if (sincP) return sincP;
  sincP = (async () => {
    try {
      for (let i = 0; i < 4; i++) {
        const parou = await enviarFila();
        if (parou || !online || sessaoExpirada) break;
        if ((await IDB.todos('fila')).length === 0) break;
      }
      if (online && !sessaoExpirada && (forcarDownload || Date.now() - ultimaSync > 90000)) {
        try { await baixarTudo(); } catch (e) { semRede(e); }
      }
    } catch (e) { semRede(e); }
    finally { sincP = null; atualizaEstado(); }
  })();
  return sincP;
}
async function baixarTudo() {
  const j = await api('/api/veiculos?completo=1');
  await IDB.tx(['veiculos', 'fila'], 'readwrite', async L => {
    const fila = await req(L.fila.getAll()), pend = new Set(fila.map(o => idmapMem[o.vid] ?? o.vid));
    const ids = new Set();
    for (const sv of j.veiculos) { ids.add(sv.id); if (!pend.has(sv.id)) await req(L.veiculos.put(sv)); }
    for (const lv of await req(L.veiculos.getAll()))
      if (lv.id > 0 && !ids.has(lv.id) && !pend.has(lv.id)) await req(L.veiculos.delete(lv.id));   // excluído no painel
  });
  ultimaSync = Date.now(); await IDB.put('kv', ultimaSync, 'ultima');
}
async function moverErro(op, msg) {
  await IDB.tx(['fila', 'erros'], 'readwrite', async L => { await req(L.erros.add({op, msg, quando: agoraStr()})); await req(L.fila.delete(op.seq)); });
}
async function executarOp(op, vid) {
  const P = (acao, dados) => post(`/api/veiculos/${vid}/${acao}`, dados);
  switch (op.tipo) {
    case 'novo_veiculo': {
      const j = await post('/api/veiculos', op.dados);
      idmapMem[op.vid] = j.id; await IDB.put('kv', idmapMem, 'idmap');
      const loc = await IDB.get('veiculos', op.vid);
      if (loc) { await IDB.tx(['veiculos'], 'readwrite', async L => { await req(L.veiculos.delete(op.vid)); loc.id = j.id; loc.chave = j.chave; await req(L.veiculos.put(loc)); }); }
      return;
    }
    case 'iniciar': return P('iniciar', op.dados);
    case 'pular': return P('pular', {etapa: op.etapa});
    case 'sem_avarias': return P('sem_avarias', {});
    case 'refazer_etapa': return P('refazer_etapa', {etapa: op.etapa});
    case 'reiniciar': return P('reiniciar', {});
    case 'apagar_foto': return post(`/api/foto/${op.fotoId}/apagar`, {});
    case 'concluir': {
      const j = await P('concluir', {quando: op.quando});
      await IDB.put('kv', {pdf: j.pdf || null, pdf_erro: j.pdf_erro || null}, 'res:' + op.vid); return j;
    }
    case 'foto': {
      const blob = await IDB.get('blobs', 'foto:' + op.fotoId);
      if (!blob) return;
      const q = new URLSearchParams({id: vid, etapa: op.etapa, legenda: op.legenda || '', quando: op.quando});
      if (op.lat != null) { q.set('lat', op.lat); q.set('lon', op.lon); if (op.acc != null) q.set('acc', op.acc); }
      await api('/api/foto?' + q, {method: 'POST', headers: {'Content-Type': blob.type || 'image/jpeg'}, body: blob});
      await IDB.del('blobs', 'foto:' + op.fotoId); return;
    }
  }
}
async function enviarFila() {   // devolve true se parou por falta de rede/sessão
  const fila = (await IDB.todos('fila')).sort((a, b) => a.seq - b.seq), falhos = new Set(), tocados = new Set();
  for (const op of fila) {
    const vid = idmapMem[op.vid] ?? op.vid;
    if (falhos.has(op.vid)) { await moverErro(op, 'Não enviada porque uma operação anterior do mesmo veículo falhou.'); continue; }
    try { await executarOp(op, vid); await IDB.del('fila', op.seq); tocados.add(op.vid); online = true; }
    catch (e) {
      if (e.sessao) { sessaoExpirada = true; return true; }
      if (e instanceof TypeError) { online = false; return true; }
      if (op.tipo === 'apagar_foto' && /não encontrad/i.test(e.message)) { await IDB.del('fila', op.seq); continue; }
      falhos.add(op.vid); await moverErro(op, e.message);
    }
  }
  for (const ov of tocados) {      // traz o estado oficial do servidor (ids das fotos etc.)
    const rid = idmapMem[ov] ?? ov;
    try {
      const j = await api('/api/veiculos/' + rid);
      await IDB.tx(['veiculos', 'fila'], 'readwrite', async L => {
        const resto = (await req(L.fila.getAll())).some(o => (idmapMem[o.vid] ?? o.vid) === rid);
        if (!resto) await req(L.veiculos.put(j.veiculo));
      });
    } catch (e) { semRede(e); if (!online) return true; }
  }
  return false;
}

/* ---------------- modelo local do veículo ---------------- */
function calcEtapas(x) {
  const cont = {}; (x.fotos || []).forEach(f => cont[f.etapa] = (cont[f.etapa] || 0) + 1);
  const pul = new Set(x.puladas_lista || []);
  return cfg.etapas.map(e => ({id: e.id, titulo: e.titulo, multi: !!e.multi, avarias: !!e.avarias, dica: e.dica || '', n: cont[e.id] || 0,
    status: cont[e.id] ? 'ok' : (e.avarias && x.sem_avarias) ? 'sem_avarias' : pul.has(e.id) ? 'pulada' : 'pendente'}));
}
function recalc(x) {
  x.fotos = x.fotos || []; x.puladas_lista = x.puladas_lista || [];
  x.etapas = calcEtapas(x); x.etapas_total = x.etapas.length; x.etapas_feitas = x.etapas.filter(e => e.status !== 'pendente').length;
  x.n_fotos = x.fotos.length;
  const a = [], o = x.itens_obj;
  if (x.situacao === 'Não localizado') a.push('nao_localizado');
  if (x.origem === 'campo') a.push('campo');
  if (x.status !== 'pendente' && x.situacao !== 'Não localizado' && x.lat == null) a.push('sem_gps');
  if (x.acc != null && x.acc > (cfg.gps_ruim || 50)) a.push('gps_impreciso');
  if (x.puladas_lista.length) a.push('puladas');
  if (x.fotos.some(f => f.etapa === 'avarias')) a.push('avarias');
  if (x.placa_legivel === 'Não') a.push('placa_ilegivel');
  if (x.parabrisa_quebrado === 'Sim') a.push('parabrisa_quebrado');
  if (x.farois_funcionando === 'Não') a.push('farois_defeito');
  if (x.categoria === 'Máquina' && x.placa_patrimonial === 'Não') a.push('sem_placa_patr');
  if (o && x.situacao !== 'Não localizado' && !o.na && !cfg.itens.every(i => o[i.id])) a.push('itens_faltando');
  x.alertas = a;
}
async function atual() {   // recarrega o veículo aberto do armazenamento local (a sincronização pode tê-lo atualizado)
  const id = idmapMem[v.id] ?? v.id, x = await IDB.get('veiculos', id);
  if (x) v = x; return v;
}
const enf = (L, vo, op) => req(L.fila.add({...op, vid: vo.id, t: Date.now()}));
async function mutar(x, fn) {      // salva o veículo e (opcional) altera a fila numa única transação
  await IDB.tx(['veiculos', 'fila', 'blobs'], 'readwrite', async L => {
    if (fn) await fn(L); recalc(x); await req(L.veiculos.put(structuredClone(x)));
  });
  sincronizar();
}
async function opsPendentes(L, vid, filtroFn) { return (await req(L.fila.getAll())).filter(o => o.vid === vid && filtroFn(o)); }
async function removerOps(L, ops) {
  for (const o of ops) { await req(L.fila.delete(o.seq)); if (o.fotoId) await req(L.blobs.delete('foto:' + o.fotoId)); }
}

async function opIniciar(d) {
  await atual(); const eraPendente = v.status === 'pendente';
  Object.assign(v, {situacao: d.situacao, odometro: d.odometro, local_visto: d.local_visto, uso_local: d.uso_local,
                    motorista: d.motorista, plotado: d.plotado, placa_legivel: d.placa_legivel, parabrisa_quebrado: d.parabrisa_quebrado,
                    farois_funcionando: d.farois_funcionando, farois_problema: d.farois_problema,
                    categoria: d.categoria, placa_patrimonial: d.placa_patrimonial, obs: d.obs, itens_obj: d.itens});
  Object.entries(d.cadastro || {}).forEach(([k, val]) => v[k] = val);
  v.chave = calcChave(v.placa, v.patrimonio) || v.chave;
  if (v.status !== 'concluido') v.status = 'em_andamento';
  if (eraPendente || !v.vistoriador_nome) { v.vistoriador_nome = usuario.nome; v.vistoriador_matricula = usuario.matricula; }
  if (!v.inicio) v.inicio = agoraStr();
  const g = gpsParams(); if (g.lat != null) { v.lat = g.lat; v.lon = g.lon; v.acc = g.acc; }
  await mutar(v, L => enf(L, v, {tipo: 'iniciar', dados: {...d, ...g, quando: agoraStr()}}));
}
async function opFoto(etapaId, file, legenda) {
  await atual(); const e = cfg.etapas.find(x => x.id === etapaId), id = 'l' + Date.now() + Math.random().toString(36).slice(2, 6);
  await mutar(v, async L => {
    if (!e.multi) {
      await removerOps(L, await opsPendentes(L, v.id, o => o.tipo === 'foto' && o.etapa === etapaId));
      v.fotos = v.fotos.filter(f => f.etapa !== etapaId);      // as do servidor são substituídas no envio
    }
    const seq = Math.max(0, ...v.fotos.filter(f => f.etapa === etapaId).map(f => f.seq || 0)) + 1, g = gpsParams();
    v.fotos.push({id, local: true, etapa: etapaId, seq, legenda, lat: g.lat ?? null, lon: g.lon ?? null, acc: g.acc ?? null, criado_em: agoraStr(), url: null, arquivo: ''});
    v.puladas_lista = v.puladas_lista.filter(x => x !== etapaId); if (e.avarias) v.sem_avarias = 0;
    if (v.status === 'pendente') v.status = 'em_andamento';
    await req(L.blobs.put(file, 'foto:' + id));
    await enf(L, v, {tipo: 'foto', etapa: etapaId, legenda, fotoId: id, quando: agoraStr(), ...g});
  });
}
async function opPular(etapaId) {
  await atual(); if (!v.puladas_lista.includes(etapaId)) v.puladas_lista.push(etapaId);
  await mutar(v, L => enf(L, v, {tipo: 'pular', etapa: etapaId}));
}
async function opSemAvarias() { await atual(); v.sem_avarias = 1; await mutar(v, L => enf(L, v, {tipo: 'sem_avarias'})); }
async function opRefazer(etapaId) {
  await atual();
  await mutar(v, async L => {
    await removerOps(L, await opsPendentes(L, v.id, o => o.tipo === 'foto' && o.etapa === etapaId));
    v.fotos = v.fotos.filter(f => f.etapa !== etapaId); v.puladas_lista = v.puladas_lista.filter(x => x !== etapaId);
    if (etapaId === 'avarias') v.sem_avarias = 0; if (v.status === 'concluido') v.status = 'em_andamento';
    await enf(L, v, {tipo: 'refazer_etapa', etapa: etapaId});
  });
}
async function opApagarFoto(f) {
  await atual(); const alvo = v.fotos.find(x => String(x.id) === String(f.id)); if (!alvo) return;
  await mutar(v, async L => {
    v.fotos = v.fotos.filter(x => x !== alvo && String(x.id) !== String(f.id));
    if (alvo.local) await removerOps(L, await opsPendentes(L, v.id, o => o.tipo === 'foto' && o.fotoId === alvo.id));
    else await enf(L, v, {tipo: 'apagar_foto', fotoId: alvo.id});
    if (v.status === 'concluido') v.status = 'em_andamento';
  });
}
async function opConcluir() {
  await atual(); recalc(v);
  if (!v.situacao) throw new Error('Informe a situação aparente antes de concluir.');
  if (v.situacao !== 'Não localizado') {
    const faltam = v.etapas.filter(e => e.status === 'pendente').map(e => e.titulo);
    if (faltam.length) throw new Error('Faltam etapas: ' + faltam.join('; '));
  }
  const idOrig = v.id; v.status = 'concluido'; v.fim = agoraStr();
  if (!v.vistoriador_nome) { v.vistoriador_nome = usuario.nome; v.vistoriador_matricula = usuario.matricula; }
  await mutar(v, L => enf(L, v, {tipo: 'concluir', quando: v.fim}));
  await sincronizar();
  const res = await IDB.get('kv', 'res:' + idOrig); if (res) await IDB.del('kv', 'res:' + idOrig);
  return res || null;
}
async function opReiniciar() {
  await atual();
  await mutar(v, async L => {
    await removerOps(L, await opsPendentes(L, v.id, () => true));
    Object.assign(v, {status: 'pendente', situacao: '', odometro: '', local_visto: '', uso_local: '', motorista: '', plotado: '', placa_legivel: '', parabrisa_quebrado: '', farois_funcionando: '', farois_problema: '', categoria: '', placa_patrimonial: '', obs: '',
      itens_obj: null, fotos: [], puladas_lista: [], sem_avarias: 0, vistoriador_nome: null, vistoriador_matricula: null,
      inicio: null, fim: null, lat: null, lon: null, acc: null});
    await enf(L, v, {tipo: 'reiniciar'});
  });
}
async function opNovoVeiculo(d) {
  const chave = calcChave(d.placa, d.patrimonio);
  if (!chave) throw new Error('Informe a placa ou o nº de patrimônio.');
  if ((await IDB.todos('veiculos')).some(x => x.chave === chave)) throw new Error(`Já existe um veículo com a identificação ${chave}.`);
  const nv = {id: -Date.now(), chave, origem: 'campo', status: 'pendente', fotos: [], puladas_lista: [], sem_avarias: 0, itens_obj: null, pdf: false, ...d};
  delete nv.origem; nv.origem = 'campo';

/* ---------------- fotos ---------------- */
function proxima() { const i = v.etapas.findIndex(e => e.status === 'pendente'); if (i < 0) telaRevisao(); else telaFoto(i); }
const avancar = idx => idx + 1 >= v.etapas.length ? telaRevisao() : telaFoto(idx + 1);
function miniaturas(fotos, apagavel) {
  return fotos.length ? `<div class="miniaturas">${fotos.map(f => `<figure><img src="${srcFoto(f, 300)}" alt="" onerror="this.style.visibility='hidden'">
    <figcaption>${esc(f.legenda) || '&nbsp;'}${f.local ? ' <i class="fa-solid fa-clock" title="Aguardando envio"></i>' : ''}</figcaption>
    ${apagavel ? `<button class="x" data-del="${f.id}"><i class="fa-solid fa-xmark"></i></button>` : ''}</figure>`).join('')}</div>` : '';
}
async function telaFoto(idx) {
  await atual(); await prepararUrls();
  const e = v.etapas[idx], fotos = v.fotos.filter(f => f.etapa === e.id), n = v.etapas.length, temFoto = fotos.length > 0;
  let botoes;
  if (e.multi) {
    botoes = `<button class="btn" id="tirar"><i class="fa-solid fa-camera"></i> ${temFoto ? 'Adicionar outra foto' : (e.avarias ? 'Tirar foto da avaria' : 'Tirar foto')}</button>`;
    if (temFoto) botoes += `<button class="btn verde" id="concluirEtapa"><i class="fa-solid fa-check"></i> Concluir etapa</button>`;
    else botoes += e.avarias
      ? `<button class="btn verde" id="semAv"><i class="fa-solid fa-circle-check"></i> Sem avarias visíveis</button>`
      : `<button class="btn cinza" id="pular"><i class="fa-solid fa-forward"></i> Não se aplica / pular</button>`;
  } else if (temFoto) {
    botoes = `<button class="btn" id="tirar"><i class="fa-solid fa-camera"></i> Tirar novamente</button>
              <button class="btn verde" id="concluirEtapa"><i class="fa-solid fa-check"></i> Manter e continuar</button>`;
  } else {
    botoes = `<button class="btn" id="tirar"><i class="fa-solid fa-camera"></i> Tirar foto</button>
              <button class="btn cinza" id="pular"><i class="fa-solid fa-forward"></i> Não se aplica / pular</button>`;
  }
  app.innerHTML = `<button class="btn sec peq" id="sairVist"><i class="fa-solid fa-arrow-left"></i> Pausar vistoria</button>
    <div class="progresso"><div style="width:${idx / n * 100}%"></div></div>
    <small>${esc(v.chave)} · Etapa ${idx + 1} de ${n}</small>
    <div class="etapa-titulo">${esc(e.titulo)}</div><div class="dica">${esc(e.dica)}</div>
    <input type="file" id="arq" accept="image/*" capture="environment" hidden>
    ${botoes}${miniaturas(fotos, true)}<div id="msg" class="erro"></div>`;
  $('#sairVist').onclick = () => telaVeiculo(v.id);
  const erro = t => { const m = $('#msg'); if (m) m.textContent = t; };
  $('#tirar').onclick = () => { $('#arq').value = ''; $('#arq').click(); };
  $('#arq').onchange = async ev => {
    const f = ev.target.files[0]; if (!f) return;
    if (e.multi) return previaFoto(idx, f);
    $$('.btn').forEach(b => b.disabled = true); erro('Salvando foto...');
    try { await opFoto(e.id, f, ''); avancar(idx); } catch (er) { $$('.btn').forEach(b => b.disabled = false); erro(er.message); }
  };
  if ($('#concluirEtapa')) $('#concluirEtapa').onclick = () => avancar(idx);
  if ($('#pular')) $('#pular').onclick = async () => {
    if (!confirm('Pular: ' + e.titulo + '?')) return;
    try { await opPular(e.id); avancar(idx); } catch (er) { tratar(er); }
  };
  if ($('#semAv')) $('#semAv').onclick = async () => { try { await opSemAvarias(); avancar(idx); } catch (er) { tratar(er); } };
  $$('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Apagar esta foto?')) return;
    try { await opApagarFoto({id: b.dataset.del}); telaFoto(idx); } catch (er) { tratar(er); }
  });
}
function previaFoto(idx, file) {
  const e = v.etapas[idx], url = URL.createObjectURL(file);
  const ex = e.avarias ? 'ex.: lanterna traseira quebrada' : 'ex.: pneu dianteiro direito gasto';
  app.innerHTML = `<div class="etapa-titulo">${esc(e.titulo)}</div>
    <img class="prev" src="${url}" alt="">
    <label>Legenda / observação (opcional)</label><input type="text" id="legenda" placeholder="${ex}">
    <button class="btn" id="maisUma"><i class="fa-solid fa-plus"></i> Salvar e adicionar outra</button>

    <button class="btn cinza" id="descartar"><i class="fa-solid fa-trash"></i> Descartar foto</button>

  const salvar = async depois => {

  $('#maisUma').onclick = () => salvar(() => telaFoto(idx));

    try { if (e.status !== 'pendente') await opRefazer(e.id); telaFoto(i); } catch (er) { tratar(er); }
  });
  $('#concluir').onclick = async ev => {
    const b = ev.currentTarget; b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
    try { telaFim(await opConcluir()); }
    catch (er) { b.disabled = false; er.sessao ? tratar(er) : $('#msg').textContent = er.message; }
  };
}
async function telaFim(res) {
  const pend = (await IDB.todos('fila')).length;
  let bloco;
  if (res && res.pdf) bloco = `<a class="btn cinza" href="${res.pdf}" target="_blank"><i class="fa-solid fa-file-pdf"></i> Abrir relatório PDF</a>`;
  else if (res && res.pdf_erro) bloco = `<div class="aviso">Vistoria salva no notebook, mas o PDF não foi gerado: ${esc(res.pdf_erro)}<br>Gere pelo painel.</div>`;
  else bloco = `<div class="aviso"><i class="fa-solid fa-cloud-arrow-up"></i> Vistoria <b>salva no celular</b>. Ela será enviada ao notebook (e o relatório PDF gerado) assim que houver conexão.
    ${pend ? `<br>Envios pendentes: <b>${pend}</b>.` : ''}</div>`;
  app.innerHTML = `<div class="grande"><i class="fa-solid fa-circle-check"></i><br>Vistoria concluída!</div>
    <div class="dica" style="text-align:center">${esc(v.chave)}</div>${bloco}
    <button class="btn verde" id="prox"><i class="fa-solid fa-arrow-right"></i> Próximo veículo</button>`;
  $('#prox').onclick = telaLista;
}

/* ---------------- veículo fora da lista ---------------- */
function telaNovo() {
  app.innerHTML = `<button class="btn sec peq" id="voltar"><i class="fa-solid fa-arrow-left"></i> Lista</button>
    <div class="etapa-titulo">Veículo fora da lista</div>
    <div class="dica">Será marcado como “cadastrado em campo” para conferência do patrimônio. Informe a placa ou, se não houver, o nº de patrimônio/série.</div>
    <label>Placa</label><input type="text" data-k="placa" autocapitalize="characters">
    <label>Nº de patrimônio</label><input type="text" data-k="patrimonio">
    <label>Tipo</label><select data-k="tipo"><option value=""></option>${cfg.tipos.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <label>Marca / Modelo</label><input type="text" data-k="marca_modelo">
    <label>Ano</label><input type="text" data-k="ano" inputmode="numeric">
    <label>Chassi / Nº de série</label><input type="text" data-k="chassi">
    <label>Secretaria</label><input type="text" data-k="secretaria">
    <label>Local</label><input type="text" data-k="local_cadastro">
    <div id="msg" class="erro"></div>
    <div class="rodape-fixo"><button class="btn verde" id="cad"><i class="fa-solid fa-check"></i> Cadastrar e vistoriar</button></div>`;
  $('#voltar').onclick = telaLista;
  $('#cad').onclick = async () => {
    const d = {}; $$('[data-k]').forEach(el => d[el.dataset.k] = el.value.trim());
    try { const nv = await opNovoVeiculo(d); telaVeiculo(nv.id); } catch (e) { $('#msg').textContent = e.message; }
  };
}
</script>
